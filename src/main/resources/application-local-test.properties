# This profile is intentionally pinned to the disposable local test database.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campussync_local_test
spring.datasource.username=${CAMPSYNC_LOCAL_TEST_DB_USERNAME}
spring.datasource.password=${CAMPSYNC_LOCAL_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/local-test-baseline
spring.flyway.default-schema=campussync_local_test
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1000
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
