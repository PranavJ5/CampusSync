# Isolated, local-only demo target. This file never creates the database.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campussync_demo
spring.datasource.username=${CAMPSYNC_DEMO_DB_USERNAME}
spring.datasource.password=${CAMPSYNC_DEMO_DB_PASSWORD}

# Refuse schema changes and migration execution during demo startup.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.flyway.clean-disabled=true

campussync.jwt.secret=${CAMPSYNC_DEMO_JWT_SECRET}
campussync.jwt.expiration-seconds=${CAMPSYNC_DEMO_JWT_EXPIRATION_SECONDS:3600}
campussync.cors.allowed-origins=${CAMPSYNC_DEMO_CORS_ALLOWED_ORIGINS:http://localhost:5173}
campussync.attendance.threshold-percent=${CAMPSYNC_DEMO_ATTENDANCE_THRESHOLD_PERCENT:75}
