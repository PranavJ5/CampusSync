<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusSync | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="border-bottom">
    <nav class="navbar navbar-expand bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CampusSync</a>
            <span class="navbar-text">Administrator</span>
        </div>
    </nav>
</header>
<div class="container-fluid">
    <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 border-end py-3">
            <nav class="nav flex-column gap-1" aria-label="Admin navigation">
                <a class="nav-link active" href="#">Dashboard</a>
                <a class="nav-link" href="#">Users</a>
                <a class="nav-link" href="#">Courses</a>
                <a class="nav-link" href="#">Departments</a>
                <a class="nav-link" href="#">Settings</a>
            </nav>
        </aside>
        <main class="col-12 col-md-9 col-lg-10 p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 mb-0">Admin Dashboard</h1>
                <button class="btn btn-primary" type="button">Create</button>
            </div>
            <section class="row g-3 mb-4" aria-label="System summary">
                <div class="col-12 col-sm-6 col-xl-3"><div class="card"><div class="card-body"><h2 class="h6 mb-0">Students</h2></div></div></div>
                <div class="col-12 col-sm-6 col-xl-3"><div class="card"><div class="card-body"><h2 class="h6 mb-0">Faculty</h2></div></div></div>
                <div class="col-12 col-sm-6 col-xl-3"><div class="card"><div class="card-body"><h2 class="h6 mb-0">Courses</h2></div></div></div>
                <div class="col-12 col-sm-6 col-xl-3"><div class="card"><div class="card-body"><h2 class="h6 mb-0">Departments</h2></div></div></div>
            </section>
            <section class="card">
                <div class="card-body">
                    <h2 class="h5">Recent activity</h2>
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead><tr><th scope="col">Activity</th><th scope="col">User</th><th scope="col">Date</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
