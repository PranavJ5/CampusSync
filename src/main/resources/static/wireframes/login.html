<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusSync | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <section class="card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-4">CampusSync</h1>
                    <form>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email address</label>
                            <input class="form-control" id="email" name="email" type="email" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" id="remember" name="remember" type="checkbox">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="#">Forgot password?</a>
                        </div>
                        <button class="btn btn-primary w-100" type="button">Sign in</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
