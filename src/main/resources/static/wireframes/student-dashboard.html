<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusSync | Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="border-bottom">
    <nav class="navbar navbar-expand bg-body-tertiary"><div class="container-fluid"><a class="navbar-brand" href="#">CampusSync</a><span class="navbar-text">Student</span></div></nav>
</header>
<div class="container-fluid">
    <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 border-end py-3">
            <nav class="nav flex-column gap-1" aria-label="Student navigation">
                <a class="nav-link active" href="#">Dashboard</a>
                <a class="nav-link" href="#">My Courses</a>
                <a class="nav-link" href="#">Schedule</a>
                <a class="nav-link" href="#">Assignments</a>
                <a class="nav-link" href="#">Grades</a>
            </nav>
        </aside>
        <main class="col-12 col-md-9 col-lg-10 p-4">
            <h1 class="h3 mb-4">Student Dashboard</h1>
            <section class="row g-3 mb-4" aria-label="Student overview">
                <div class="col-12 col-lg-8"><div class="card h-100"><div class="card-body"><h2 class="h5">Today's schedule</h2><div class="table-responsive"><table class="table mb-0"><thead><tr><th scope="col">Course</th><th scope="col">Time</th><th scope="col">Location</th></tr></thead><tbody></tbody></table></div></div></div></div>
                <div class="col-12 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h5">Announcements</h2></div></div></div>
            </section>
            <section class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Upcoming assignments</h2><a href="#">View all</a></div>
                    <div class="table-responsive"><table class="table mb-0"><thead><tr><th scope="col">Assignment</th><th scope="col">Course</th><th scope="col">Due date</th></tr></thead><tbody></tbody></table></div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
